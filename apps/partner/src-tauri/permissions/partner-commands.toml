[[permission]]
identifier = "allow-host-boot"
description = "Enables the host_boot command."
commands.allow = ["host_boot"]

[[permission]]
identifier = "allow-host-dispatch"
description = "Enables the host_dispatch command."
commands.allow = ["host_dispatch"]

[[set]]
identifier = "partner-commands"
description = "Workbench Host IPC command permissions."
permissions = [
  "allow-host-boot",
  "allow-host-dispatch",
]
